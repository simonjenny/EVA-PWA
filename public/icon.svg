<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App background -->
  <rect width="512" height="512" fill="#1C1C2E"/>

  <!-- Board panel -->
  <rect x="56" y="80" width="400" height="352" rx="24" fill="#0A0A1A"/>

  <!-- Header bar -->
  <rect x="56" y="80" width="400" height="68" rx="24" fill="#007AFF"/>
  <rect x="56" y="120" width="400" height="28" fill="#007AFF"/>
  <!-- Header label dots (like a real board clock area) -->
  <circle cx="100" cy="114" r="10" fill="white" opacity="0.5"/>
  <rect x="124" y="106" width="180" height="16" rx="8" fill="white" opacity="0.85"/>
  <rect x="368" y="104" width="60" height="20" rx="6" fill="white" opacity="0.3"/>
  <rect x="374" y="110" width="48" height="8" rx="4" fill="white" opacity="0.7"/>

  <!-- Row 1 -->
  <rect x="56" y="148" width="400" height="84" fill="#111128"/>
  <!-- Line badge row 1 (green = tram) -->
  <rect x="80" y="168" width="62" height="44" rx="10" fill="#34C759"/>
  <text x="111" y="197" font-family="Arial,sans-serif" font-weight="800" font-size="26" fill="white" text-anchor="middle">6</text>
  <!-- Destination bar row 1 -->
  <rect x="158" y="175" width="210" height="14" rx="7" fill="white" opacity="0.9"/>
  <rect x="158" y="199" width="130" height="10" rx="5" fill="white" opacity="0.35"/>
  <!-- Time badge row 1 -->
  <rect x="388" y="168" width="44" height="44" rx="10" fill="#007AFF" opacity="0.25"/>
  <rect x="392" y="180" width="36" height="10" rx="5" fill="#007AFF"/>
  <rect x="396" y="198" width="28" height="8" rx="4" fill="#007AFF" opacity="0.6"/>

  <!-- Divider -->
  <rect x="80" y="232" width="352" height="1" fill="white" opacity="0.08"/>

  <!-- Row 2 -->
  <rect x="56" y="233" width="400" height="84" fill="#0A0A1A"/>
  <!-- Line badge row 2 (orange = bus) -->
  <rect x="80" y="253" width="62" height="44" rx="10" fill="#FF9500"/>
  <text x="111" y="282" font-family="Arial,sans-serif" font-weight="800" font-size="26" fill="white" text-anchor="middle">11</text>
  <!-- Destination bar row 2 -->
  <rect x="158" y="260" width="185" height="14" rx="7" fill="white" opacity="0.9"/>
  <rect x="158" y="284" width="110" height="10" rx="5" fill="white" opacity="0.35"/>
  <!-- Time badge row 2 -->
  <rect x="388" y="253" width="44" height="44" rx="10" fill="#007AFF" opacity="0.25"/>
  <rect x="392" y="265" width="36" height="10" rx="5" fill="#007AFF"/>
  <rect x="396" y="283" width="28" height="8" rx="4" fill="#007AFF" opacity="0.6"/>

  <!-- Divider -->
  <rect x="80" y="317" width="352" height="1" fill="white" opacity="0.08"/>

  <!-- Row 3 -->
  <rect x="56" y="318" width="400" height="84" fill="#111128"/>
  <rect x="56" y="366" width="400" height="36" rx="0" fill="#111128"/>
  <rect x="56" y="378" width="400" height="30" rx="24" fill="#111128"/>
  <!-- Line badge row 3 (red) -->
  <rect x="80" y="338" width="62" height="44" rx="10" fill="#FF3B30"/>
  <text x="111" y="367" font-family="Arial,sans-serif" font-weight="800" font-size="26" fill="white" text-anchor="middle">S8</text>
  <!-- Destination bar row 3 -->
  <rect x="158" y="345" width="220" height="14" rx="7" fill="white" opacity="0.9"/>
  <rect x="158" y="369" width="150" height="10" rx="5" fill="white" opacity="0.35"/>
  <!-- Time badge row 3 -->
  <rect x="388" y="338" width="44" height="44" rx="10" fill="#007AFF" opacity="0.25"/>
  <rect x="392" y="350" width="36" height="10" rx="5" fill="#007AFF"/>
  <rect x="396" y="368" width="28" height="8" rx="4" fill="#007AFF" opacity="0.6"/>
</svg>
