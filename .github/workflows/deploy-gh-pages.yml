name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          set -o pipefail
          npm run build -- --base=/${{ github.event.repository.name }}/ 2>&1 | tee build.log

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo
            if [ -d dist ]; then
              echo "Status: ✅ Build erfolgreich"
              echo
              echo "Top-level dist Inhalte:"
              echo '```'
              ls -lah dist
              echo '```'
            else
              echo "Status: ❌ Build fehlgeschlagen"
              echo
              echo "Letzte 80 Zeilen build.log:"
              echo '```'
              tail -n 80 build.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure build output exists
        run: test -d dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: ${{ needs.build.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4